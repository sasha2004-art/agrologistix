[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrologistix-backend"
version = "0.1.0"
description = "AgroLogistix bio-logistics API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "scipy>=1.14,<2.0",
    "sqlmodel>=0.0.22,<1.0",
    "sqlalchemy>=2.0.14,<2.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001-003 flag Cyrillic letters in Russian product data and docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
