# HTTP-only bootstrap configuration.
#
# deploy/setup-https.sh installs this file before the TLS certificate exists,
# so certbot can answer the HTTP-01 challenge on port 80. After the certificate
# is issued the script replaces it with deploy/nginx/agrologistix.conf (TLS).

server {
    listen 80;
    server_name _;

    root /var/www/agrologistix;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agrologistix;
        default_type text/plain;
    }

    # PIN checks are throttled separately from the rest of the API.
    location = /api/v1/auth/verify-pin {
        limit_req zone=agrologistix_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Pin $http_x_access_pin;
    }

    location /api/ {
        limit_req zone=agrologistix_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Pin $http_x_access_pin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
