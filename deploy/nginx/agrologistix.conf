# AgroLogistix origin configuration: static SPA + FastAPI reverse proxy.
# The TLS certificate is issued by certbot (Let's Encrypt) for the deploy domain,
# see deploy/setup-https.sh.

server {
    listen 80;
    server_name prod.surf _;

    root /var/www/agrologistix;
    index index.html;

    # Local healthcheck used by deploy.sh on 127.0.0.1.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 challenge (works through the Cloudflare proxy).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agrologistix;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name prod.surf;

    root /var/www/agrologistix;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/prod.surf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.surf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Сборка Vite — это один ленивый чанк дашборда на ~2 МБ (mapbox-gl + Vuetify)
    # и ~0,5 МБ CSS. Без сжатия они отдавались как есть и грузились десятки
    # секунд; gzip уменьшает их в 3–4 раза (2,1 МБ → ~0,6 МБ).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    # text/html nginx сжимает всегда; шрифты (woff2) уже сжаты и в список не входят.
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Имена ассетов содержат хеш сборки: их можно кэшировать навсегда.
    # Иначе после каждого деплоя браузер заново качал весь бандл.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Pin $http_x_access_pin;
    }

    # index.html всегда ревалидируется: в нём лежат ссылки на новые хеши.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
