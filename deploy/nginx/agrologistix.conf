# AgroLogistix origin configuration: static SPA + FastAPI reverse proxy.
# The TLS certificate is issued by certbot (Let's Encrypt) for the deploy domain,
# see deploy/setup-https.sh.

server {
    listen 80;
    server_name prod.surf _;

    root /var/www/agrologistix;
    index index.html;

    # Local healthcheck used by deploy.sh on 127.0.0.1.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Let's Encrypt HTTP-01 challenge (works through the Cloudflare proxy).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agrologistix;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name prod.surf;

    root /var/www/agrologistix;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/prod.surf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.surf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Pin $http_x_access_pin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
