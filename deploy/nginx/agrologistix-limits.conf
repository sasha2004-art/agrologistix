# Rate limiting zones shared by the AgroLogistix virtual hosts.
#
# This file is installed into /etc/nginx/conf.d/ so that the zones live in the
# http context (a file under sites-available/ is a server context and cannot
# declare limit_req_zone).
#
# auth: a six-digit PIN must not be brute-forced, so the verify-pin endpoint is
# limited to a few attempts per minute per address.
# api: a cheap flood guard for the whole API; the dashboard polls the ERP state
# once per second, which is far below this limit.
limit_req_zone $binary_remote_addr zone=agrologistix_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=agrologistix_api:10m rate=30r/s;
